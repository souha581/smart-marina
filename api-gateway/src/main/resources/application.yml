server:
  port: 8080

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI:http://localhost:8180/realms/smart-marina}
          jwk-set-uri: ${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8180/realms/smart-marina/protocol/openid-connect/certs}
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - AddResponseHeader=X-Gateway, smart-marina-gateway
          routes:
            - id: port-service
              uri: ${PORT_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/ports/**
            - id: pedestal-service
              uri: ${PEDESTAL_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/pedestals/**
            - id: consumption-service
              uri: ${CONSUMPTION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/consumptions/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always
