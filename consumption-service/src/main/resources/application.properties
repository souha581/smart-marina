spring.application.name=consumption-service
server.port=8083

spring.datasource.url=jdbc:postgresql://localhost:5435/consumptiondb
spring.datasource.username=${DB_USERNAME:consumption}
spring.datasource.password=${DB_PASSWORD:consumption123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

pedestal-service.url=http://localhost:8082

# Kafka Producer Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

