services:
  # ==================== INFRASTRUCTURE ====================
  postgres-port:
    image: postgres:16
    container_name: postgres-port
    environment:
      POSTGRES_DB: portdb
      POSTGRES_USER: port
      POSTGRES_PASSWORD: port123
    ports:
      - "5433:5432"
    volumes:
      - postgres-port-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U port -d portdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smart-marina-network

  postgres-pedestal:
    image: postgres:16
    container_name: postgres-pedestal
    environment:
      POSTGRES_DB: pedestaldb
      POSTGRES_USER: pedestal
      POSTGRES_PASSWORD: pedestal123
    ports:
      - "5434:5432"
    volumes:
      - postgres-pedestal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pedestal -d pedestaldb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smart-marina-network

  postgres-consumption:
    image: postgres:16
    container_name: postgres-consumption
    environment:
      POSTGRES_DB: consumptiondb
      POSTGRES_USER: consumption
      POSTGRES_PASSWORD: consumption123
    ports:
      - "5435:5432"
    volumes:
      - postgres-consumption-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consumption -d consumptiondb"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - smart-marina-network

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    networks:
      - smart-marina-network

  # ==================== MICROSERVICES ====================
  port-service:
    build: ./port-service
    container_name: port-service
    ports:
      - "8081:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-port:5432/portdb
      DB_USERNAME: port
      DB_PASSWORD: port123
    depends_on:
      postgres-port:
        condition: service_healthy
    networks:
      - smart-marina-network

  pedestal-service:
    build: ./pedestal-service
    container_name: pedestal-service
    ports:
      - "8082:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-pedestal:5432/pedestaldb
      DB_USERNAME: pedestal
      DB_PASSWORD: pedestal123
      PORT_SERVICE_URL: http://port-service:8081
    depends_on:
      postgres-pedestal:
        condition: service_healthy
      port-service:
        condition: service_started
    networks:
      - smart-marina-network

  consumption-service:
    build: ./consumption-service
    container_name: consumption-service
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-consumption:5432/consumptiondb
      DB_USERNAME: consumption
      DB_PASSWORD: consumption123
      PEDESTAL_SERVICE_URL: http://pedestal-service:8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-consumption:
        condition: service_healthy
      pedestal-service:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - smart-marina-network

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "8084:8084"
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_started
    restart: on-failure
    networks:
      - smart-marina-network

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      PORT_SERVICE_URL: http://port-service:8081
      PEDESTAL_SERVICE_URL: http://pedestal-service:8082
      CONSUMPTION_SERVICE_URL: http://consumption-service:8083
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8180/realms/smart-marina
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8080/realms/smart-marina/protocol/openid-connect/certs
    depends_on:
      - port-service
      - pedestal-service
      - consumption-service
      - keycloak
    networks:
      - smart-marina-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8080"
    networks:
      - smart-marina-network

volumes:
  postgres-port-data:
  postgres-pedestal-data:
  postgres-consumption-data:

networks:
  smart-marina-network:
    driver: bridge