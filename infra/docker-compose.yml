services:
  postgres-port:
    image: postgres:16
    container_name: postgres-port
    environment:
      POSTGRES_DB: portdb
      POSTGRES_USER: port
      POSTGRES_PASSWORD: port123
    ports:
      - "5433:5432"
    volumes:
      - postgres-port-data:/var/lib/postgresql/data

  postgres-pedestal:
    image: postgres:16
    container_name: postgres-pedestal
    environment:
      POSTGRES_DB: pedestaldb
      POSTGRES_USER: pedestal
      POSTGRES_PASSWORD: pedestal123
    ports:
      - "5434:5432"
    volumes:
      - postgres-pedestal-data:/var/lib/postgresql/data

  postgres-consumption:
    image: postgres:16
    container_name: postgres-consumption
    environment:
      POSTGRES_DB: consumptiondb
      POSTGRES_USER: consumption
      POSTGRES_PASSWORD: consumption123
    ports:
      - "5435:5432"
    volumes:
      - postgres-consumption-data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"

volumes:
  postgres-port-data:
  postgres-pedestal-data:
  postgres-consumption-data:
